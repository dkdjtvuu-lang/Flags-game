<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.6.0/css/flag-icons.min.css">
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0;
           padding: 8px; background: var(--tg-theme-bg-color);
           color: var(--tg-theme-text-color); }
    .hide { display: none; }
    .fi { font-size: 8em; margin: 16px; }
    button { display: block; width: 90%; margin: 8px auto;
             padding: 14px; font-size: 18px; }
    small { font-size: 13px; opacity: 0.8; }
    h1 { margin: 24px 0 8px; }
    #barWrap { width: 90%; height: 10px; margin: 8px auto 4px;
               background: rgba(128,128,128,0.3); border-radius: 5px;
               overflow: hidden; }
    #barFill { height: 100%; width: 100%; background: #4caf50; }
    #hud { font-size: 20px; margin: 6px 0; }
  </style>
</head>
<body>

  <div id="menu">
    <h1>Угадай флаг</h1>
    <p>Выбери режим</p>
    <button onclick="startGame('easy')">Лёгкий<br>
      <small>известные страны · 15 с</small><br>
      <small id="rec_easy"></small></button>
    <button onclick="startGame('hard')">Сложный<br>
      <small>все страны · 7 с</small><br>
      <small id="rec_hard"></small></button>
  </div>

  <div id="game" class="hide">
    <div id="hud"></div>
    <div id="barWrap"><div id="barFill"></div></div>
    <div id="timeText"></div>
    <span id="flag" class="fi"></span>
    <div id="answers"></div>
  </div>

  <div id="over" class="hide">
    <h1>Игра окончена</h1>
    <p id="overText" style="font-size:20px;line-height:1.6"></p>
    <button onclick="startGame(mode)">Играть снова</button>
    <button onclick="openMenu()">В меню</button>
  </div>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();

    const countries = {
af:"Афганистан",al:"Албания",dz:"Алжир",ad:"Андорра",ao:"Ангола",
ag:"Антигуа и Барбуда",ar:"Аргентина",am:"Армения",au:"Австралия",
at:"Австрия",az:"Азербайджан",bs:"Багамы",bh:"Бахрейн",bd:"Бангладеш",
bb:"Барбадос",by:"Беларусь",be:"Бельгия",bz:"Белиз",bj:"Бенин",
bt:"Бутан",bo:"Боливия",ba:"Босния и Герцеговина",bw:"Ботсвана",
br:"Бразилия",bn:"Бруней",bg:"Болгария",bf:"Буркина-Фасо",bi:"Бурунди",
cv:"Кабо-Верде",kh:"Камбоджа",cm:"Камерун",ca:"Канада",
cf:"Центральноафриканская Республика",td:"Чад",cl:"Чили",cn:"Китай",
co:"Колумбия",km:"Коморы",cg:"Республика Конго",cd:"ДР Конго",
cr:"Коста-Рика",ci:"Кот-д’Ивуар",hr:"Хорватия",cu:"Куба",cy:"Кипр",
cz:"Чехия",dk:"Дания",dj:"Джибути",dm:"Доминика",
do:"Доминиканская Республика",ec:"Эквадор",eg:"Египет",sv:"Сальвадор",
gq:"Экваториальная Гвинея",er:"Эритрея",ee:"Эстония",sz:"Эсватини",
et:"Эфиопия",fj:"Фиджи",fi:"Финляндия",fr:"Франция",ga:"Габон",
gm:"Гамбия",ge:"Грузия",de:"Германия",gh:"Гана",gr:"Греция",
gd:"Гренада",gt:"Гватемала",gn:"Гвинея",gw:"Гвинея-Бисау",gy:"Гайана",
ht:"Гаити",hn:"Гондурас",hu:"Венгрия",is:"Исландия",in:"Индия",
id:"Индонезия",ir:"Иран",iq:"Ирак",ie:"Ирландия",il:"Израиль",
it:"Италия",jm:"Ямайка",jp:"Япония",jo:"Иордания",kz:"Казахстан",
ke:"Кения",ki:"Кирибати",kp:"КНДР",kr:"Южная Корея",kw:"Кувейт",
kg:"Киргизия",la:"Лаос",lv:"Латвия",lb:"Ливан",ls:"Лесото",
lr:"Либерия",ly:"Ливия",li:"Лихтенштейн",lt:"Литва",lu:"Люксембург",
mg:"Мадагаскар",mw:"Малави",my:"Малайзия",mv:"Мальдивы",ml:"Мали",
mt:"Мальта",mh:"Маршалловы Острова",mr:"Мавритания",mu:"Маврикий",
mx:"Мексика",fm:"Микронезия",md:"Молдова",mc:"Монако",mn:"Монголия",
me:"Черногория",ma:"Марокко",mz:"Мозамбик",mm:"Мьянма",na:"Намибия",
nr:"Науру",np:"Непал",nl:"Нидерланды",nz:"Новая Зеландия",
ni:"Никарагуа",ne:"Нигер",ng:"Нигерия",mk:"Северная Македония",
no:"Норвегия",om:"Оман",pk:"Пакистан",pw:"Палау",pa:"Панама",
pg:"Папуа — Новая Гвинея",py:"Парагвай",pe:"Перу",ph:"Филиппины",
pl:"Польша",pt:"Португалия",qa:"Катар",ro:"Румыния",ru:"Россия",
rw:"Руанда",kn:"Сент-Китс и Невис",lc:"Сент-Люсия",
vc:"Сент-Винсент и Гренадины",ws:"Самоа",sm:"Сан-Марино",
st:"Сан-Томе и Принсипи",sa:"Саудовская Аравия",sn:"Сенегал",
rs:"Сербия",sc:"Сейшелы",sl:"Сьерра-Леоне",sg:"Сингапур",
sk:"Словакия",si:"Словения",sb:"Соломоновы Острова",so:"Сомали",
za:"ЮАР",ss:"Южный Судан",es:"Испания",lk:"Шри-Ланка",sd:"Судан",
sr:"Суринам",se:"Швеция",ch:"Швейцария",sy:"Сирия",tj:"Таджикистан",
tz:"Танзания",th:"Таиланд",tl:"Восточный Тимор",tg:"Того",to:"Тонга",
tt:"Тринидад и Тобаго",tn:"Тунис",tr:"Турция",tm:"Туркменистан",
tv:"Тувалу",ug:"Уганда",ua:"Украина",ae:"ОАЭ",gb:"Великобритания",
us:"США",uy:"Уругвай",uz:"Узбекистан",vu:"Вануату",va:"Ватикан",
ve:"Венесуэла",vn:"Вьетнам",ye:"Йемен",zm:"Замбия",zw:"Зимбабве",
ps:"Палестина",tw:"Тайвань",xk:"Косово"
    };

    const easyCodes = ["ru","us","gb","fr","de","it","es","pt","nl","be",
      "ch","at","se","no","fi","dk","pl","ua","by","kz","tr","gr","cn",
      "jp","kr","in","br","ar","mx","ca","au","eg","za","il","sa","ir",
      "cz","hu","ro","bg","rs","hr","ie","is","th","vn","id","cu","cl",
      "co","pe","ve","nz","ae","ge","am","az","uz"]
      .filter(c => countries[c]);

    const MODES = {
      easy: { time: 15, codes: easyCodes },
      hard: { time: 7,  codes: Object.keys(countries) }
    };

    let mode = "easy", score = 0, streak = 0, bestStreak = 0,
        lives = 3, timer = null, locked = false;

    function show(id) {
      ["menu", "game", "over"].forEach(x =>
        document.getElementById(x).classList.toggle("hide", x !== id));
    }

    function lsGet(key) {
      try { return parseInt(localStorage.getItem(key)) || 0; }
      catch (e) { return 0; }
    }

    function getRecord(m, cb) {
      const key = "rec_" + m;
      let done = false;
      const finish = v => { if (!done) { done = true; cb(v); } };
      try {
        if (tg.CloudStorage && tg.isVersionAtLeast("6.9")) {
          tg.CloudStorage.getItem(key, (e, v) =>
            finish(Math.max(parseInt(v) || 0, lsGet(key))));
          setTimeout(() => finish(lsGet(key)), 1500);
          return;
        }
      } catch (e) {}
      finish(lsGet(key));
    }

    function setRecord(m, v) {
      const key = "rec_" + m;
      try { localStorage.setItem(key, String(v)); } catch (e) {}
      try {
        if (tg.CloudStorage && tg.isVersionAtLeast("6.9")) {
          tg.CloudStorage.setItem(key, String(v));
        }
      } catch (e) {}
    }

    function openMenu() {
      clearInterval(timer);
      show("menu");
      ["easy", "hard"].forEach(m => getRecord(m, v => {
        document.getElementById("rec_" + m).textContent = "Рекорд: " + v;
      }));
    }

    function updateHud() {
      document.getElementById("hud").textContent =
        "❤️".repeat(lives) + "🖤".repeat(3 - lives) +
        "   🔥 " + streak + "   ✅ " + score;
    }

    function startGame(m) {
      mode = m;
      score = 0; streak = 0; bestStreak = 0; lives = 3;
      show("game");
      updateHud();
      next();
    }

    function endGame() {
      clearInterval(timer);
      getRecord(mode, rec => {
        const isNew = score > rec;
        if (isNew) setRecord(mode, score);
        document.getElementById("overText").innerHTML =
          "Угадано: <b>" + score + "</b><br>" +
          "Лучшая серия: <b>" + bestStreak + "</b><br>" +
          (isNew ? "🏆 Новый рекорд!" : "Рекорд: <b>" + rec + "</b>");
        show("over");
      });
    }

    function answer(chosen, right, buttons) {
      if (locked) return;
      locked = true;
      clearInterval(timer);
      const ok = chosen === right;
      if (ok) {
        score++; streak++;
        if (streak > bestStreak) bestStreak = streak;
      } else {
        lives--; streak = 0;
      }
      buttons[right].style.background = "#4caf50";
      if (chosen && !ok) buttons[chosen].style.background = "#e53935";
      updateHud();
      setTimeout(() => lives <= 0 ? endGame() : next(), ok ? 800 : 1500);
    }

    function next() {
      locked = false;
      const pool = MODES[mode].codes;
      const TIME = MODES[mode].time;
      const right = pool[Math.floor(Math.random() * pool.length)];
      const opts = pool.filter(c => c !== right)
        .sort(() => Math.random() - 0.5).slice(0, 3).concat(right)
        .sort(() => Math.random() - 0.5);

      document.getElementById("flag").className = "fi fi-" + right;
      const box = document.getElementById("answers");
      box.innerHTML = "";
      const buttons = {};
      opts.forEach(c => {
        const b = document.createElement("button");
        b.textContent = countries[c];
        b.onclick = () => answer(c, right, buttons);
        buttons[c] = b;
        box.appendChild(b);
      });

      let left = TIME;
      const bar = document.getElementById("barFill");
      const text = document.getElementById("timeText");
      bar.style.transition = "none";
      bar.style.width = "100%";
      void bar.offsetWidth;
      bar.style.transition = "width 1s linear";
      text.textContent = "⏱ " + left + " с";
      clearInterval(timer);
      timer = setInterval(() => {
        left--;
        text.textContent = "⏱ " + Math.max(left, 0) + " с";
        bar.style.width = (Math.max(left, 0) / TIME * 100) + "%";
        if (left <= 0) answer(null, right, buttons);
      }, 1000);
    }

    openMenu();
  </script>
</body>
</html>
