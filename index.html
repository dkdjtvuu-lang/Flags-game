<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.6.0/css/flag-icons.min.css">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      background: #0b1020;
      color: #fff;
      text-align: center;
    }

    .hide { display: none !important; }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 24px 0 8px;
    }

    .subtitle {
      color: #9ca9c5;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 36px;
      font-weight: 900;
      margin-top: 20px;
      background: linear-gradient(90deg, #55d6ff, #a47bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .section-title {
      text-align: left;
      font-size: 20px;
      margin: 28px 0 14px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category {
      background: #19233a;
      border: 1px solid #293958;
      border-radius: 18px;
      padding: 20px 10px;
      min-height: 125px;
      text-align: left;
      cursor: pointer;
      color: white;
    }

    .category:active { transform: scale(0.96); }
    .category .icon { font-size: 34px; }
    .category h3 { margin: 12px 0 5px; font-size: 17px; }
    .category small { color: #aab7d0; }

    .main-card {
      background: linear-gradient(135deg, #293f75, #553b91);
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
    }

    button {
      border: 1px solid #354565;
      border-radius: 13px;
      background: #202d49;
      color: white;
      cursor: pointer;
      display: block;
      width: 90%;
      margin: 8px auto;
      padding: 14px;
      font-size: 18px;
    }

    .main-card button {
      background: #fff;
      color: #18213b;
      border: 0;
      border-radius: 12px;
      font-weight: bold;
    }

    .back-button {
      background: transparent;
      border: 1px solid #354565;
      width: auto;
      padding: 10px 18px;
      margin: 10px auto;
    }

    #prompt {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 10px;
      line-height: 1.4;
    }

    #hud {
      font-size: 20px;
      margin: 15px 0 6px;
    }

    #barWrap {
      width: 90%;
      height: 10px;
      margin: 8px auto 4px;
      background: rgba(128, 128, 128, 0.3);
      border-radius: 5px;
      overflow: hidden;
    }

    #barFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #43d9ff, #9b73ff);
    }

    .fi {
      font-size: 8em;
      margin: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 94%;
      margin: 0 auto;
    }

    .grid button {
      width: 100%;
      margin: 0;
      padding: 12px 6px;
    }

    small {
      font-size: 13px;
      opacity: 0.8;
    }

  </div>
